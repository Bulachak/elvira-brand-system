      <line x1="25" y1="960" x2="45" y2="960"/>
      <line x1="1035" y1="960" x2="1055" y2="960"/>
    </g>

    <!-- Top & Bottom Abstract Rule Bands -->
    <g transform="translate(540, 150)">
      <line x1="-380" y1="0" x2="380" y2="0" stroke="#D4AF37" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#C02B37"/>
      <line x1="-80" y1="-8" x2="80" y2="-8" stroke="#F5F0E6" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>
      <polygon points="-380,-6 -386,0 -380,6" fill="#D4AF37"/>
      <polygon points="380,-6 386,0 380,6" fill="#D4AF37"/>
